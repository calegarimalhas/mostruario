<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Calegari Malhas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Calegari Malhas <span style="font-size: 0.5em; font-weight: 400; opacity: 0.8;">(Mostruário Digital)</span></h1>
            <!-- Ícone de carrinho foi removido para a versão estática -->
        </div>
        <nav id="tabs-container">
            <!-- As abas serão geradas via JS -->
        </nav>
    </header>

    <main id="catalog-container">
        <!-- O grid de imagens será gerado via JS -->
    </main>

    <!-- Modal do Produto -->
    <div id="product-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;"> <!-- Menor pois não tem os seletores -->
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body" style="flex-direction: column;"> <!-- Para empilhar imagem e código -->
                <div class="image-wrapper" style="width: 100%; border-right: none;">
                    <img id="modal-image" src="" alt="Estampa" style="width: 100%;">
                    <video id="modal-video" src="" autoplay loop muted playsinline style="display: none; width: 100%; border-radius: 12px;"></video>
                </div>
                <div class="product-info" style="width: 100%; padding: 20px 0 0 0; text-align: center;">
                    <h2 id="modal-title" style="font-size: 2em; margin: 0;">Código</h2>
                    <p style="color: #666; margin-top: 10px; margin-bottom: 10px;">Anote este código e as especificações de cores/tamanhos para enviar seu pedido.</p>
                    
                    <!-- Informação visual de cores disponíveis (Estático e sem seleção) -->
                    <div id="info-cores-container" style="display: none; justify-content: center; align-items: flex-start; gap: 30px; flex-wrap: wrap; margin-top: 20px;">
                        
                        <div id="info-cores-infantil" style="display: none; flex-direction: column; align-items: center;">
                            <span style="font-weight: 600; font-size: 0.9em; color: var(--text-light); margin-bottom: 8px;">Cores de Camisa Disponíveis:</span>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                                <span class="color-btn" style="background: white; border-color: #ddd; padding: 4px 10px; font-size: 0.8em; cursor: default;">Branco</span>
                                <span class="color-btn" style="background: #40e0d0; color: white; border-color: transparent; padding: 4px 10px; font-size: 0.8em; cursor: default;">Azul Turquesa</span>
                                <span class="color-btn" style="background: #ffb6c1; color: white; border-color: transparent; padding: 4px 10px; font-size: 0.8em; cursor: default;">Rosa Chiclete</span>
                            </div>
                        </div>

                        <div id="info-cores-silkscreen" style="display: none; flex-direction: column; align-items: center;">
                            <span style="font-weight: 600; font-size: 0.9em; color: var(--text-light); margin-bottom: 8px;">Cores de Camisa Disponíveis:</span>
                            <div style="display: flex; gap: 8px;">
                                <span class="color-square" style="background: black; width: 25px; height: 25px; cursor: default;" title="Preta"></span>
                                <span class="color-square" style="background: #e30000; width: 25px; height: 25px; cursor: default;" title="Vermelha"></span>
                                <span class="color-square" style="background: #2b53a3; width: 25px; height: 25px; cursor: default;" title="Azul Royal"></span>
                                <span class="color-square" style="background: #000080; width: 25px; height: 25px; cursor: default;" title="Azul Marinho"></span>
                            </div>
                        </div>

                        <div id="info-estampa-silkscreen" style="display: none; flex-direction: column; align-items: center;">
                            <span style="font-weight: 600; font-size: 0.9em; color: var(--text-light); margin-bottom: 8px;">Cores de Estampa Disponíveis:</span>
                            <div style="display: flex; gap: 10px;">
                                <img src="tintabranca.png" style="width: 30px; height: 30px; border-radius: 50%; object-fit: contain; border: 1px solid #ddd;" title="Branca">
                                <img src="tintadourada.png" style="width: 30px; height: 30px; border-radius: 50%; object-fit: contain; border: 1px solid #ddd;" title="Dourada">
                                <img src="tintaprata.png" style="width: 30px; height: 30px; border-radius: 50%; object-fit: contain; border: 1px solid #ddd;" title="Prata">
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Carrinho e botões de checkout foram removidos para a versão estática -->

    <script src="dados.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
