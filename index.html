<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Calegari Malhas (Mostruário Digital)</title>
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Metadados de Compartilhamento e Preview de Link (WhatsApp, Facebook, Instagram, Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Calegari Malhas - Mostruário Digital">
    <meta property="og:description" content="Confira nosso mostruário digital completo de estampas: Baby Look, Body, Frente Total, Sublimação Infantil, Silkscreen e muito mais.">
    <meta property="og:image" content="preview.jpg">
    <meta property="og:image:secure_url" content="preview.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Calegari Malhas">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Calegari Malhas - Mostruário Digital">
    <meta name="twitter:description" content="Confira nosso mostruário digital completo de estampas.">
    <meta name="twitter:image" content="preview.jpg">

    <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Calegari Malhas <span style="font-size: 0.5em; font-weight: 400; opacity: 0.8;">(Mostruário Digital)</span></h1>
        </div>
        <div class="tabs-wrapper">
            <button class="tabs-arrow-btn tabs-arrow-left" onclick="scrollTabs(-180)" aria-label="Abas à esquerda">‹</button>
            <nav id="tabs-container">
                <!-- As abas serão geradas via JS -->
            </nav>
            <button class="tabs-arrow-btn tabs-arrow-right" onclick="scrollTabs(180)" aria-label="Abas à direita">›</button>
        </div>
    </header>

    <!-- Sub-filtros por Tema (Solto e Empilhável) -->
    <div id="subfilters-container" class="subfilters-container" style="display: none;">
        <div id="subfilters-list" class="subfilters-list"></div>
    </div>

    <main id="catalog-container">
        <!-- O grid de imagens será gerado via JS -->
    </main>

    <!-- Modal do Produto (Mostruário Visual) -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="image-wrapper" onclick="openZoomModal()" title="Clique para ampliar">
                    <img id="modal-image" src="" alt="Estampa">
                    <video id="modal-video" src="" autoplay loop muted playsinline style="display: none; width: 100%; border-radius: 12px;"></video>
                    <span class="zoom-badge-hint">🔍 Clique para ampliar</span>
                </div>
                <div class="product-info">
                    <h2 id="modal-title">Código</h2>
                    
                    <!-- Descrição/Aviso do Modelo -->
                    <div id="modal-description" style="display: none; font-size: 0.95rem; color: #444; margin: 10px 0; background: #eef2f5; padding: 10px 14px; border-radius: 8px; border-left: 4px solid var(--primary-color); font-weight: 500;"></div>
                    
                    <!-- Seletor de Strass (Acabamento) -->
                    <div id="strass-selector-container" class="variant-selector" style="display: none;">
                        <h3>Acabamento:</h3>
                        <div class="variant-options">
                            <label class="variant-option">
                                <input type="radio" name="strass-option" value="Com Pedrinha" checked>
                                <span class="variant-btn">
                                    <img src="strass.png" alt="Strass" class="strass-icon" onerror="this.style.display='none'">
                                    Com Pedrinha
                                </span>
                            </label>
                            <label class="variant-option">
                                <input type="radio" name="strass-option" value="Sem Pedrinha">
                                <span class="variant-btn">Sem Pedrinha</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Seletor de Variação (Estampas/Vídeos) -->
                    <div id="variation-selector-container" class="variant-selector" style="display: none;">
                        <h3>Variação:</h3>
                        <div id="variation-options" class="variant-options">
                            <!-- Injetado via JS -->
                        </div>
                    </div>
                    
                    <!-- Seletor Especial de Tecido / Modelo (Baby Look Selo) -->
                    <div id="fabric-selector-container" class="variant-selector" style="display: none;">
                        <h3>Modelo / Tecido:</h3>
                        <div class="variant-options">
                            <label class="variant-option">
                                <input type="radio" name="fabric-option" value="Baby Visco" checked>
                                <span class="variant-btn">Baby Visco</span>
                            </label>
                            <label class="variant-option">
                                <input type="radio" name="fabric-option" value="Baby Poliéster">
                                <span class="variant-btn">Baby Poliéster</span>
                            </label>
                        </div>
                    </div>

                    <!-- Seletor de Modelo de Camiseta Silkscreen (Mostruário Interativo) -->
                    <div id="silk-model-selector-container" class="variant-selector" style="display: none;">
                        <h3>Modelo Disponível:</h3>
                        <div class="variant-options">
                            <label class="variant-option">
                                <input type="radio" name="silk-model-option" value="Adulto" checked>
                                <span class="variant-btn">Adulto</span>
                            </label>
                            <label class="variant-option">
                                <input type="radio" name="silk-model-option" value="Infantil">
                                <span class="variant-btn">Infantil</span>
                            </label>
                            <label class="variant-option">
                                <input type="radio" name="silk-model-option" value="Baby Viscolycra">
                                <span class="variant-btn">Baby Viscolycra</span>
                            </label>
                        </div>
                    </div>

                    <!-- Seletor de Cores da Camisa -->
                    <div id="color-selector-container" class="variant-selector" style="display: none;">
                        <h3>Cor da Camisa:</h3>
                        
                        <!-- Cores Sublimação Adulto -->
                        <div id="color-options-adulto" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-adulto" value="Branca" checked>
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branca</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-adulto" value="Mescla">
                                <span class="color-btn" style="background: #a9a9a9; color: white;">Mescla</span>
                            </label>
                        </div>

                        <!-- Cores Sublimação Infantil -->
                        <div id="color-options-infantil" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Branco" checked>
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branco</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Azul Turquesa">
                                <span class="color-btn" style="background: #40e0d0; color: white;">Azul Turquesa</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Rosa Chiclete">
                                <span class="color-btn" style="background: #ffb6c1; color: white;">Rosa Chiclete</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Rosa Bebê">
                                <span class="color-btn" style="background: #ffc0cb; color: black;">Rosa Bebê</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Azul Bebê">
                                <span class="color-btn" style="background: #89cff0; color: black;">Azul Bebê</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Mescla">
                                <span class="color-btn" style="background: #a9a9a9; color: white;">Mescla</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Amarelo">
                                <span class="color-btn" style="background: #ffd700; color: black;">Amarelo</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-infantil" value="Lilás">
                                <span class="color-btn" style="background: #c8a2c8; color: black;">Lilás</span>
                            </label>
                        </div>
                        
                        <!-- Cores Viscolycra Infantil Selo -->
                        <div id="color-options-infantil-selo" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Preta" checked>
                                <span class="color-btn" style="background: black; color: white;">Preta</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Rosa">
                                <span class="color-btn" style="background: #ffc0cb; color: black;">Rosa</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Marinho">
                                <span class="color-btn" style="background: #000080; color: white;">Marinho</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Vinho">
                                <span class="color-btn" style="background: #722f37; color: white;">Vinho</span>
                            </label>
                        </div>
                        
                        <!-- Cores Baby Look Selo -->
                        <div id="color-options-babylook-selo" class="color-options" style="display: none;">
                            <label class="color-option color-opt-baby-common">
                                <input type="radio" name="color-option-babylook-selo" value="Preta" checked>
                                <span class="color-btn" style="background: black; color: white;">Preta</span>
                            </label>
                            <label class="color-option color-opt-baby-common">
                                <input type="radio" name="color-option-babylook-selo" value="Branca">
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branca</span>
                            </label>
                            <label class="color-option color-opt-baby-common">
                                <input type="radio" name="color-option-babylook-selo" value="Mescla">
                                <span class="color-btn" style="background: #a9a9a9; color: white;">Mescla</span>
                            </label>
                            <label class="color-option color-opt-baby-common">
                                <input type="radio" name="color-option-babylook-selo" value="Marinho">
                                <span class="color-btn" style="background: #000080; color: white;">Marinho</span>
                            </label>
                            <label class="color-option color-opt-baby-visco-only">
                                <input type="radio" name="color-option-babylook-selo" value="Pink">
                                <span class="color-btn" style="background: #ff1493; color: white;">Pink</span>
                            </label>
                            <label class="color-option color-opt-baby-visco-only">
                                <input type="radio" name="color-option-babylook-selo" value="Vinho">
                                <span class="color-btn" style="background: #722f37; color: white;">Vinho</span>
                            </label>
                        </div>
                        
                        <!-- Cores Viés Body Infantil -->
                        <div id="color-options-body" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Branco" checked>
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branco</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Preto">
                                <span class="color-btn" style="background: black; color: white;">Preto</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Marinho">
                                <span class="color-btn" style="background: #000080; color: white;">Marinho</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Rosa Chiclete">
                                <span class="color-btn" style="background: #ffb6c1; color: white;">Rosa Chiclete</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Rosa Bebê">
                                <span class="color-btn" style="background: #ffc0cb; color: black;">Rosa Bebê</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Azul Turquesa">
                                <span class="color-btn" style="background: #40e0d0; color: white;">Azul Turquesa</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Azul Royal">
                                <span class="color-btn" style="background: #2b53a3; color: white;">Azul Royal</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Vermelho">
                                <span class="color-btn" style="background: #e30000; color: white;">Vermelho</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Amarelo">
                                <span class="color-btn" style="background: #ffd700; color: black;">Amarelo</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Verde Bandeira">
                                <span class="color-btn" style="background: #008000; color: white;">Verde Bandeira</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Laranja">
                                <span class="color-btn" style="background: #ffa500; color: white;">Laranja</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Lilás">
                                <span class="color-btn" style="background: #c8a2c8; color: black;">Lilás</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Azul Bebê">
                                <span class="color-btn" style="background: #89cff0; color: black;">Azul Bebê</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-body" value="Mescla">
                                <span class="color-btn" style="background: #a9a9a9; color: white;">Mescla</span>
                            </label>
                        </div>
                        
                        <!-- Cores Silkscreen Adulto / Infantil -->
                        <div id="color-options-silkscreen-adulto" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Preta" checked>
                                <span class="color-square" style="background: black;" title="Preta"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Vermelha">
                                <span class="color-square" style="background: #e30000;" title="Vermelha"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Azul Royal">
                                <span class="color-square" style="background: #2b53a3;" title="Azul Royal"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Azul Marinho">
                                <span class="color-square" style="background: #000080;" title="Azul Marinho"></span>
                            </label>
                        </div>
                        
                        <!-- Cores Silkscreen Baby Viscolycra -->
                        <div id="color-options-silkscreen-baby" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Preto">
                                <span class="color-square" style="background: black;" title="Preto"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Marinho">
                                <span class="color-square" style="background: #000080;" title="Marinho"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Pink">
                                <span class="color-square" style="background: #ff1493;" title="Pink"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Mescla">
                                <span class="color-square" style="background: #a9a9a9;" title="Mescla"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Vinho">
                                <span class="color-square" style="background: #722f37;" title="Vinho"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Branco">
                                <span class="color-square" style="background: white; border: 2px solid #ccc;" title="Branco"></span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Seletor de Cor da Estampa (Silkscreen) -->
                    <div id="print-color-selector-container" class="variant-selector" style="display: none;">
                        <h3>Cor da Estampa:</h3>
                        <div class="print-color-options">
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Branca" checked>
                                <img src="tintabranca.png" alt="Branca" class="print-color-img">
                            </label>
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Dourada">
                                <img src="tintadourada.png" alt="Dourada" class="print-color-img">
                            </label>
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Prata">
                                <img src="tintaprata.png" alt="Prata" class="print-color-img">
                            </label>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Zoom na Imagem (Lightbox) -->
    <div id="zoom-modal" class="zoom-modal" onclick="closeZoomModal()">
        <span class="zoom-close-btn" onclick="closeZoomModal()">&times; Fechar</span>
        <div class="zoom-content" onclick="event.stopPropagation()">
            <img id="zoom-image" src="" alt="Zoom da Estampa">
            <video id="zoom-video" src="" autoplay loop muted playsinline style="display: none;"></video>
            <p class="zoom-tip">🔍 Dica: toque na foto para ver mais de perto</p>
        </div>
    </div>

    <script src="dados.js?v=38"></script>
    <script src="catalogo.js?v=38"></script>
</body>
</html>
